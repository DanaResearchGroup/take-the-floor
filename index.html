<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Take the Floor</title>
  <meta name="description" content="Practice English presentations in virtual reality. Teacher dashboard and privacy policy.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%236345d6'/%3E%3Cpath d='M9 10h14M16 10v13' stroke='%23ffffff' stroke-width='3'/%3E%3C/svg%3E">
  <style>
    :root{--ink:#20233e;--muted:#5d647f;--accent:#6245d1}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;color:var(--ink);
      background:radial-gradient(circle at 20% 10%,#2c2466 0,#15182e 55%);font:16px/1.6 "Segoe UI",Arial,sans-serif}
    main{width:100%;max-width:480px;background:#fff;border-radius:22px;padding:40px 32px;text-align:center;box-shadow:0 20px 60px #0007}
    .mark{display:inline-grid;place-items:center;width:56px;height:60px;border-radius:16px;background:linear-gradient(145deg,#9b83ff,#6747d8);color:#fff;box-shadow:0 5px 0 #443485}
    .mark svg{width:38px;height:38px}
    h1{margin:18px 0 6px;font-size:2rem;letter-spacing:-.8px}
    p{margin:0 0 20px;color:var(--muted)}
    .button{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;border-radius:11px;padding:13px 22px;box-shadow:0 3px 0 #493297}
    .button:hover{background:#5033be}
    small{display:block;margin-top:14px;color:var(--muted)}
    footer{margin-top:28px;font-size:.875rem}footer a{color:var(--accent)}
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none"><path d="M6 11h20v11l-5-3h-4l-2 3h-4l-5-3z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M11 14v3m10-3v3M10 7h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
    <h1>Take the Floor</h1>
    <p>Practice English presentations in front of a virtual audience. Technion.</p>
    <a class="button" href="https://take-the-floor-dashboard.onrender.com/">Open the teacher dashboard</a>
    <small>For invited teachers. The first visit after a quiet period can take up to a minute while the server wakes up.</small>
    <footer><a href="privacy.html">Privacy Policy</a> · <a href="mailto:vrdevicetechnion@gmail.com">Contact</a></footer>
  </main>
</body>
</html>
