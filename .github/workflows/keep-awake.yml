name: Keep dashboard awake
# Render's free plan sleeps after 15 idle minutes; one tiny request every 10 keeps it warm, so the
# dashboard keeps refreshing its Google Drive token daily (Google only expires tokens unused for 6 months).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions:
  contents: write  # Only for the heartbeat commit below.
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl -fsS -m 120 -o /dev/null https://take-the-floor-dashboard.onrender.com/auth/config
  heartbeat:
    # GitHub disables scheduled workflows after 60 days without repository activity; commit a
    # timestamp when the last commit is older than 50 days so this schedule never switches off.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            date -u +%Y-%m-%dT%H:%M:%SZ > .heartbeat
            git config user.name "keep-awake"
            git config user.email "keep-awake@users.noreply.github.com"
            git add .heartbeat
            git commit -m "Heartbeat: keep the keep-awake schedule enabled"
            git push
          fi
