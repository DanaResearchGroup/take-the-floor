name: Keep dashboard awake
# Render's free plan sleeps after 15 idle minutes; one tiny request every 10 keeps it warm.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: curl -fsS -m 120 -o /dev/null https://take-the-floor-dashboard.onrender.com/auth/config
